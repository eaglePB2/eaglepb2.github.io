    <script>
        // 极简的视图切换逻辑
        document.addEventListener('DOMContentLoaded', () => {
            const navToolbox = document.getElementById('nav-toolbox');
            const btnBack = document.getElementById('btn-back');

            navToolbox.addEventListener('click', (e) => {
                e.preventDefault();
                document.body.classList.add('show-toolbox');
            });

            btnBack.addEventListener('click', () => {
                document.body.classList.remove('show-toolbox');
            });
        });
    </script>

    <!-- 启动音效播放（带浏览器拦截容错） -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            const audio = new Audio('assets/audio/sound.mp3');
            audio.volume = 0.5;
            audio.play().catch(err => {
                console.log("浏览器拦截了自动播放，等待用户首次交互后触发", err);
                // 可选：绑定一次任意点击后播放
                const unlockAudio = () => {
                    audio.play().catch(() => { });
                    window.removeEventListener('click', unlockAudio);
                };
                window.addEventListener('click', unlockAudio);
            });
        });
    </script>
