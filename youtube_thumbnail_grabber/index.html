<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="../assets/favicons/favicon-32x32.png">
    <title>YouTube 縮略圖提取器 - 鷹的儲藏室</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            background-color: #121925;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Microsoft YaHei", sans-serif;
            color: #fff;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            background-image: url('../assets/img/mask.png');
            background-repeat: repeat;
        }

        .header-nav {
            width: 100%;
            max-width: 1080px;
            margin-bottom: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .back-link {
            color: #00b3ba;
            text-decoration: none;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #fff;
        }

        .tool-card {
            width: 100%;
            max-width: 1080px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 24px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
            margin-bottom: 30px;
        }

        .tool-title {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .badge {
            font-size: 11px;
            background: rgba(0, 179, 186, 0.2);
            color: #00b3ba;
            border: 1px solid #00b3ba;
            padding: 2px 8px;
            border-radius: 12px;
        }

        .tool-tip {
            font-size: 13px;
            color: #858585;
            margin-bottom: 20px;
        }

        .control-group {
            display: flex;
            gap: 10px;
        }

        .url-input {
            flex: 1;
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 6px;
            padding: 10px 14px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .url-input:focus {
            border-color: #00b3ba;
        }

        .extract-btn {
            background: #00b3ba;
            color: #121925;
            font-weight: 600;
            border: none;
            border-radius: 6px;
            padding: 0 24px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .extract-btn:hover {
            background: #00d2da;
        }

        .extract-btn:active {
            transform: scale(0.98);
        }

        .error-msg {
            color: #ff5555;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }

        /* 縮略圖網格列表 */
        .results-container {
            width: 100%;
            max-width: 1080px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
        }

        .thumb-card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, border-color 0.2s;
        }

        .thumb-card:hover {
            transform: translateY(-3px);
            border-color: rgba(0, 179, 186, 0.4);
        }

        .thumb-preview-box {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #080c13;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .thumb-img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        .thumb-info {
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .thumb-name {
            font-size: 14px;
            font-weight: 600;
            color: #fff;
        }

        .thumb-desc {
            font-size: 12px;
            color: #858585;
            margin-bottom: 8px;
        }

        .thumb-actions {
            margin-top: auto;
            display: flex;
            gap: 10px;
        }

        .action-link {
            flex: 1;
            text-align: center;
            background: rgba(0, 179, 186, 0.15);
            color: #00b3ba;
            border: 1px solid rgba(0, 179, 186, 0.4);
            padding: 6px 0;
            border-radius: 4px;
            text-decoration: none;
            font-size: 12px;
            transition: all 0.2s;
        }

        .action-link:hover {
            background: #00b3ba;
            color: #121925;
            font-weight: 600;
        }
    </style>
</head>

<body>
    <header class="header-nav">
        <a href="../" class="back-link">&larr; 返回首頁</a>
        <span style="font-size: 13px; color: #858585;">鷹の儲藏室 / 工具箱</span>
    </header>

    <main class="tool-card">
        <h1 class="tool-title">
            YouTube 縮略圖提取器
            <span class="badge">Thumbnail Grabber</span>
        </h1>
        <p class="tool-tip">支援一般影片連結、短連結 (youtu.be)、Shorts 或純 11 位 Video ID。</p>

        <div class="control-group">
            <input type="text" id="url-input" class="url-input" 
                   placeholder="例如：https://www.youtube.com/watch?v=chLFshf6V1A" autofocus>
            <button id="extract-btn" class="extract-btn">提取縮略圖</button>
        </div>
        <div id="error-msg" class="error-msg">請輸入有效的 YouTube 影片連結或 11 位 Video ID！</div>
    </main>

    <!-- 就地動態網格容器，不再搞弱智的全螢幕 Modal -->
    <section id="results-grid" class="results-container"></section>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const urlInput = document.getElementById('url-input');
            const extractBtn = document.getElementById('extract-btn');
            const errorMsg = document.getElementById('error-msg');
            const resultsGrid = document.getElementById('results-grid');

            // 結構化規格陣列：消除手動拼接字符串
            const THUMB_SPECS = [
                { title: "最高解析度 (MaxRes)", file: "maxresdefault.jpg", desc: "1280 × 720 (原生高清)" },
                { title: "標準解析度 (Standard)", file: "sddefault.jpg", desc: "640 × 480" },
                { title: "高解析度 (High Quality)", file: "hqdefault.jpg", desc: "480 × 360" },
                { title: "中等解析度 (Medium)", file: "mqdefault.jpg", desc: "320 × 180" },
                { title: "預設縮略圖 (Default)", file: "default.jpg", desc: "120 × 90" },
                { title: "影格畫面 1", file: "hq1.jpg", desc: "影片開頭節點截圖" },
                { title: "影格畫面 2", file: "hq2.jpg", desc: "影片中間節點截圖" },
                { title: "影格畫面 3", file: "hq3.jpg", desc: "影片後段節點截圖" }
            ];

            // 一次性正則提取，相容多種格式
            function extractVideoID(inputVal) {
                const trimmed = inputVal.trim();
                if (/^[\w-]{11}\$/.test(trimmed)) {
                    return trimmed;
                }
                const match = trimmed.match(/(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|shorts\/)|[\?&]v=)([\w-]{11})/);
                return match ? match[1] : null;
            }

            function renderThumbnails(videoId) {
                resultsGrid.innerHTML = '';
                
                THUMB_SPECS.forEach(spec => {
                    const imgUrl = `https://img.youtube.com/vi/${videoId}/${spec.file}`;
                    
                    const card = document.createElement('div');
                    card.className = 'thumb-card';
                    card.innerHTML = `
                        <div class="thumb-preview-box">
                            <img src="${imgUrl}" alt="${spec.title}" class="thumb-img" loading="lazy"
                                 onerror="this.parentElement.innerHTML='<span style=\\'font-size:12px;color:#666\\'>該解析度未提供</span>'">
                        </div>
                        <div class="thumb-info">
                            <span class="thumb-name">${spec.title}</span>
                            <span class="thumb-desc">${spec.desc}</span>
                            <div class="thumb-actions">
                                <a href="${imgUrl}" target="_blank" class="action-link">新分頁檢視原圖</a>
                            </div>
                        </div>
                    `;
                    resultsGrid.appendChild(card);
                });
            }

            function handleExtract() {
                const videoId = extractVideoID(urlInput.value);
                if (!videoId) {
                    errorMsg.style.display = 'block';
                    resultsGrid.innerHTML = '';
                    return;
                }
                errorMsg.style.display = 'none';
                renderThumbnails(videoId);
            }

            extractBtn.addEventListener('click', handleExtract);
            urlInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') handleExtract();
            });

            // 預載示例
            urlInput.value = "https://www.youtube.com/watch?v=chLFshf6V1A";
            handleExtract();
        });
    </script>
</body>

</html>
